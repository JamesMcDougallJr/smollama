node:
  name: "llama-master"

ollama:
  host: "localhost"
  port: 11434
  # qwen2.5:1.5b replaced gemma4:e2b (5.1B, 7.2 GB): 35s vs 104s per observation
  # cycle, 1.1 GB vs 3.6 GB resident. Small models only hold their output shape
  # under a JSON schema — see build_observation_schema in observation_loop.py.
  model: "qwen2.5:1.5b"
  # Any NEGATIVE duration = resident forever. Never the bare "-1" (400 error).
  keep_alive: "-1m"
  think: false

mqtt:
  broker: "localhost"
  port: 1883
  # Optional auth
  # username: "smollama"
  # password: "secret"
  topics:
    subscribe:
      - "smollama/#"    # Wildcard — receives from all nodes automatically
    publish_prefix: "smollama/llama-master"

plugins:
  paths: []

  builtin:
    system:
      enabled: true
      config: {}
    macos_temp:
      enabled: false
      config: {}
    hcsr04:
      enabled: false   # not wired; unwired it reports a phantom 0.0 that reads as a stuck sensor
      config:
        trig_pin: 23
        echo_pin: 24
        max_distance: 4.0
        chip: 0
    led:
      enabled: false
      config:
        pin: 17        # BCM 17 = Pin 11
        active_high: true
    sh5461as:
      enabled: false
      config:
        digit_pins: [17, 27, 22, 5]
        segment_pins: {a: 6, b: 13, c: 19, d: 26, e: 21, f: 20, g: 16, dp: 12}

    # Observation-domain plugins (master-side): specialize the observation loop
    # for audio/video sources. Disabled = fully generic behavior (default).
    vision_observation:
      enabled: false
      config:
        # full_id patterns this domain claims (matches relayed edge readings
        # like "pipi:jetson_inference:person_count" and local ones alike)
        source_patterns: ["*jetson_inference*"]
        # Window for "no humans detected in the past X hours" derivations
        absence_window_hours: 3
        # Optional: override/extend the meaning of source names for the prompt
        # source_semantics:
        #   person_count: "number of humans currently detected by the camera"
    audio_observation:
      enabled: false
      config:
        source_patterns: []   # skeleton — no audio sensor yet

  custom: []

agent:
  system_prompt: |
    You are the central Llama node orchestrating a distributed LLM system.
    You aggregate observations from edge Alpaca devices and provide semantic search
    across the distributed memory system.

    Available tools:
    - search_observations: Search observations from all nodes
    - search_memories: Search stored memories across nodes
    - publish: Send messages to specific nodes or broadcast

    Summarize trends and patterns you observe from multiple edge nodes.

  max_tool_iterations: 10
  ollama_retry_attempts: 3
  ollama_retry_backoff_seconds: 2.0
  ollama_fallback_mode: "skip"

# Memory system configuration
memory:
  db_path: "~/.smollama/memory.db"
  embedding_provider: "ollama"
  embedding_model: "all-minilm:l6-v2"
  observation_enabled: true
  observation_interval_minutes: 15
  observation_lookback_minutes: 60
  # How domain passes (vision/audio observer plugins) share the LLM budget:
  #   "replace"  — an active domain takes the cycle's single LLM call, rotating
  #                among active domains (memory-constrained nodes)
  #   "parallel" — generic + every active domain pass run each cycle
  observation_domains_mode: "replace"
  sensor_log_retention_days: 90

# CLIP frame search (camera keyframes, see docs/frame-search.md)
# Master side: index + dashboard/tool search. Edge camera nodes instead set
# enabled: true with mode "edge" to relay the writer's spool.
frames:
  enabled: true
  db_path: "~/.smollama/frames.db"
  thumbnail_dir: "~/.smollama/frames"
  # Exported by scripts/jetson/export_clip.py — both must point at the SAME
  # export the Jetson's image encoder came from, or search silently degrades
  clip_text_model: "~/clip-export/text_encoder.onnx"
  clip_tokenizer: "~/clip-export/bpe_simple_vocab_16e6.txt.gz"
  retention_days: 30
  archive_dir: ""         # e.g. "~/frame-archive" — staged before pruning
  archive_command: ""     # e.g. "rclone move ~/frame-archive remote:frames"
  # Zero-shot activity matcher (master-only): scores window embeddings against
  # a prompt file of text categories. Edit the categories, not the code — see
  # config/activity_prompts.yaml and smollama/frames/activity_matcher.py.
  activity_prompts: "config/activity_prompts.yaml"
  activity_default_threshold: 0.22
  activity_score_keyframes: false  # v0: score only temporal windows, not every keyframe
  # Edge-only settings (camera node relaying the writer's spool):
  spool_dir: "~/.smollama/frames_spool"
  publish_batch: 5
  spool_max_entries: 500

# CRDT sync configuration (master doesn't sync elsewhere)
sync:
  enabled: false
  llama_url: ""
  sync_interval_minutes: 5
  crdt_db_path: "~/.smollama/sync.db"

# Mem0 semantic memory layer (enabled on Llama master)
mem0:
  enabled: true
  server_url: "http://localhost:8050"
  bridge_enabled: true
  index_observations: true
  index_memories: true
  bridge_interval_seconds: 30
  compose_file: "deploy/mem0/docker-compose.yml"

discovery:
  enabled: false
