[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smollama"
version = "0.1.0"
description = "A distributed LLM coordination system for Raspberry Pi and small computers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.26.0",
    "numpy>=2.2.6",
    "ollama>=0.4",
    "paho-mqtt>=2.0",
    "pyyaml>=6.0",
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
# Platform-specific features
pi = ["RPi.GPIO", "gpiozero", "lgpio>=0.2", "adafruit-blinka>=9.0.4", "adafruit-circuitpython-dht>=3.7", "smbus2>=0.6.1", "rplcd>=1.3"]  # Raspberry Pi GPIO support

# Feature groups
memory = ["sqlite-vec>=0.1.7"]
dashboard = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "jinja2>=3.1.0", "zeroconf>=0.132.0"]
mem0 = ["httpx[socks]>=0.24.0"]
# CLIP text-query encoder on the master (frames/text_encoder.py). Without these,
# frame search silently degrades to LIKE-over-labels and /activity cannot score.
frames = ["onnxruntime>=1.17", "regex"]
# Model evaluation: the cloud judge in smollama/evals/judge.py. Only needed to
# score a run, never to generate one — see docs/model-evaluation.md.
evals = ["anthropic>=0.69"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx[socks]"]

# Cross-platform: all features that work on any system (Mac, Linux, Pi)
all = ["sqlite-vec>=0.1.7", "fastapi>=0.100.0", "uvicorn>=0.23.0", "jinja2>=3.1.0", "httpx[socks]>=0.24.0", "zeroconf>=0.132.0"]

[project.scripts]
smollama = "smollama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["smollama"]
