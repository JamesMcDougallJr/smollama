{% if statuses %}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    {% for s in statuses %}
    <div class="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex items-start gap-3">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center text-lg shrink-0
            {% if s.domain == 'vision' %}bg-teal-50{% elif s.domain == 'audio' %}bg-blue-50{% else %}bg-slate-100{% endif %}">
            {% if s.domain == 'vision' %}🎥{% elif s.domain == 'audio' %}🎙️{% else %}📊{% endif %}
        </div>
        <div class="min-w-0">
            <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-slate-900 capitalize">{{ s.domain }}</span>
                <span class="w-2 h-2 rounded-full shrink-0 {% if s.has_data %}bg-emerald-400{% else %}bg-slate-300{% endif %}"
                      title="{% if s.has_data %}Receiving data{% else %}No recent data{% endif %}"></span>
            </div>
            <p class="mt-1 text-sm text-slate-600">{{ s.status }}</p>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
